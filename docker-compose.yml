version: "3.8"

services:
  gateway:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - dataveil-data:/home/dataveil/.dataveil
    environment:
      - DV_GATEWAY_HOST=0.0.0.0
      - DV_GATEWAY_PORT=8787
      - DV_AUDIT_ENABLED=true
      - DV_AUDIT_LOG_PATH=/home/dataveil/.dataveil/audit.jsonl
      - DV_VAULT_PATH=/home/dataveil/.dataveil/vault.db
      # Set your vault password via env or secrets
      # - DV_VAULT_PASSWORD=changeme
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Redis for caching (future)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped

volumes:
  dataveil-data:
  # redis-data:
