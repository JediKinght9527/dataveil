[project]
name = "dataveil"
version = "0.1.0"
description = "Privacy-first local gateway for LLM APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "click>=8.1",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typing-extensions>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
dv = "dv.cli.main:cli"

[project.urls]
Homepage = "https://github.com/yourname/dataveil"
Repository = "https://github.com/yourname/dataveil"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dv"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
